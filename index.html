<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل امارات | WireGuard</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19; --card-bg: #111827; --card-border: #1f2937;
            --primary: #3b82f6; --text-main: #f3f4f6; --text-muted: #9ca3af;
            --success: #10b981; --danger: #ef4444; --gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .header-card, .panel-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .header-card h1 { font-size: 1.1rem; margin-bottom: 4px; color: #fff; }
        .header-card p { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
        .owner-badge { display: inline-block; background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; }
        
        .nav-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .nav-tab { flex: 1; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 4px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; text-align: center; }
        .nav-tab.active { background: var(--primary); color: #fff; font-weight: bold; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section-title { font-size: 0.9rem; margin-bottom: 10px; color: #fff; text-align: right; font-weight: bold; }
        
        .form-group { margin-bottom: 10px; text-align: right; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        input { width: 100%; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; color: #fff; font-size: 0.85rem; outline: none; }
        
        .btn-gradient { width: 100%; background: var(--gradient); color: #fff; border: none; padding: 11px; border-radius: 10px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        
        .config-item { background: #0f172a; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 10px; text-align: right; }
        .config-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.85rem; font-weight: bold; }
        .config-info { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; }
        
        .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
        .action-btn { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 4px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center; }
        .action-btn.download { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .action-btn.copy { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .action-btn.qr { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .action-btn.danger { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .action-btn.sub { background: var(--gradient); color: #fff; border: none; grid-column: span 3; }
        
        .status-badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 6px; }
        .status-badge.active { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-badge.disabled { background: rgba(239,68,68,0.2); color: #f87171; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid var(--card-border); width: 90%; max-width: 320px; }
        #qrcode { background: #fff; padding: 10px; border-radius: 8px; display: inline-block; margin: 12px 0; }
        .close-modal { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>پنل 🇦🇪 امارات</h1>
        <p>پنل متصل به کانفیگ اصلی WireGuard | حجم پنل بر اساس سهم کانفیگ</p>
        <div class="owner-badge"><i class="fa-solid fa-shield-halved"></i> مالک: Arsin</div>
    </div>

    <div class="nav-tabs">
        <div class="nav-tab" onclick="switchTab('dashboard', this)">داشبورد</div>
        <div class="nav-tab active" onclick="switchTab('create', this)">ساخت کانفیگ</div>
        <div class="nav-tab" onclick="switchTab('configs', this)">کانفیگ‌ها</div>
        <div class="nav-tab" onclick="switchTab('sub', this)">لینک ساب</div>
    </div>

    <!-- داشبورد -->
    <div id="dashboard" class="tab-content">
        <div class="panel-card">
            <div class="section-title">📊 داشبورد این پنل</div>
            <p class="form-label" style="text-align: right; margin-bottom: 6px;">کشور: 🟢 سرور اصلی</p>
