<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>پنل 🇩🇪 آلمان | PUBGメAZVIX</title>
<style>
:root{--accent:#14b8a6;--accent2:#f97316;--card:rgba(12,18,34,0.95);--text:#e2e8f0;--muted:#94a3b8;--border:#14b8a655}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,"Segoe UI",sans-serif;background:linear-gradient(145deg,#05080f,#0c1222);color:var(--text);min-height:100vh;line-height:1.65;padding:14px}
.wrap{max-width:780px;margin:0 auto}
header{text-align:center;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:12px}
header h1{font-size:1.3rem;background:linear-gradient(90deg,var(--accent),#60a5fa,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border:1px solid var(--accent);border-radius:999px;font-size:0.75rem;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.nav button{padding:10px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;font-weight:700;font-size:0.88rem;font-family:inherit}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#14b8a633,#f9731628);border-color:var(--accent)}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:1.05rem;color:var(--accent);margin-bottom:10px}
label{display:block;font-size:0.82rem;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:10px;background:#0a1020;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem}
textarea{min-height:70px;font-family:monospace;font-size:0.75rem;direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{padding:11px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:0.86rem;margin:3px;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05080f}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-d{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5}
.cfg{background:rgba(10,16,32,0.8);border-radius:12px;padding:12px;margin:10px 0;border:1px solid rgba(255,255,255,0.08)}
.cfg strong{color:var(--accent)}
.meta{font-size:0.84rem;color:var(--muted);line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0a1220;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:99;opacity:0;transition:0.3s;font-weight:600;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.owner{color:#a78bfa;font-size:0.85rem;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛡️ پنل 🇩🇪 آلمان</h1>
    <p style="color:var(--muted);margin-top:6px;font-size:0.9rem">پنل اختصاصی گیمینگ PUBGメAZVIX</p>
    <span class="badge">مالک PUBGメAZVIX</span>
  </header>

  <div class="nav">
    <button type="button" class="active" data-tab="dash">📊 داشبورد</button>
    <button type="button" data-tab="create">➕ ساخت کانفیگ</button>
    <button type="button" data-tab="configs">📂 کانفیگ‌ها</button>
  </div>

  <div id="tab-dash" class="tab active">
    <div class="card">
      <h2>📊 وضعیت پنل گیمینگ</h2>
      <div class="meta" id="statusMeta">...</div>
      <div id="dashList" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="tab-create" class="tab">
    <div class="card">
      <h2>➕ ساخت کانفیگ پرقدرت گیم</h2>
      <div class="row">
        <div><label>نام کانفیگ</label><input type="text" id="cfgName" value="VlN_game_germany"/></div>
        <div><label>حجم (گیگ)</label><input type="number" id="cfgGB" value="50"/></div>
      </div>
      <div style="margin-top:14px"><button type="button" class="btn btn-p" id="btnCreate">✨ ساخت و دانلود فوری فایل</button></div>
    </div>
  </div>

  <div id="tab-configs" class="tab">
    <div class="card">
      <h2>📂 کانفیگ‌های ساخته‌شده</h2>
      <div id="cfgList"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var FIXED_PRIV = "yPzPy3/6sXaeQHAi5cl4QVb21K9fw68B2V7dy9Pk7Wo=";
  var FIXED_IP = "10.8.9.199";
  var SERVER_PUB = "hw8izxup9rk6FzWrWeCQxj+wNmSszp1JH3XmK87auVk=";
  var ENDPOINT = "de.stonecoldstunner.ir:8445";
  var STORAGE_KEY = "wg_vl_fixed_v1";
  var CONFIGS = [];

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  function switchTab(id) {
    document.querySelectorAll(".nav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === id);
    });
    document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
    var el = document.getElementById("tab-" + id);
    if (el) el.classList.add("active");
    if (id === "dash") renderDash();
    if (id === "configs") renderList();
  }

  document.querySelectorAll(".nav button").forEach(function(btn){
    btn.addEventListener("click", function(){ switchTab(btn.getAttribute("data-tab")); });
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) CONFIGS = JSON.parse(raw) || [];
    } catch (e) { CONFIGS = []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIGS));
  }

  function buildConf(name, gb) {
    return [
      "# VlN Gaming WireGuard | Owner: PUBGメAZVIX",
      "# Name: " + name,
      "# Volume: " + gb + "GB",
      "",
      "[Interface]",
      "PrivateKey = " + FIXED_PRIV,
      "Address = " + FIXED_IP + "/32",
      "DNS = 1.1.1.1",
      "MTU = 1280",
      "",
      "[Peer]",
      "PublicKey = " + SERVER_PUB,
      "Endpoint = " + ENDPOINT,
      "AllowedIPs = 0.0.0.0/0",
      "PersistentKeepalive = 25",
      ""
    ].join("\n");
  }

  function downloadText(text, filename) {
    var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 100);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("✅ با موفقیت کپی شد"); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast("✅ کپی شد"); } catch(e) { toast("❌ خطا در کپی"); }
      document.body.removeChild(ta);
    }
  }

  function renderList() {
    var list = document.getElementById("cfgList");
    if (!CONFIGS.length) {
      list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:16px">هنوز کانفیگی ساخته نشده است</p>';
      return;
    }
    var html = "";
    CONFIGS.forEach(function(cfg, i) {
      html += '<div class="cfg"><strong>🎮 ' + cfg.name + '</strong><br>' +
        '<span style="font-size:0.82rem;color:var(--muted)">حجم: ' + cfg.gb + 'GB | آی‌پی: ' + FIXED_IP + '</span>' +
        '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
        '<button class="btn btn-p" data-act="dl" data-idx="' + i + '">⬇️ دانلود فایل</button>' +
        '<button class="btn btn-o" data-act="copy" data-idx="' + i + '">📋 کپی متن</button>' +
        '<button class="btn btn-d" data-act="del" data-idx="' + i + '">🗑️ حذف</button></div></div>';
    });
    list.innerHTML = html;
  }

  function renderDash() {
    document.getElementById("statusMeta").innerHTML = "تعداد کانفیگ‌های ثبت‌شده: <strong>" + CONFIGS.length + "</strong><br>وضعیت سرور: <span style='color:#86efac'>متصل و بهینه برای پابجی و وب‌گردی</span><br><span class='owner'>مالک PUBGメAZVIX</span>";
    document.getElementById("dashList").innerHTML = '<p style="color:var(--muted)">پنل روی کلید اصلی و ثابت تنظیم شده است.</p>';
  }

  document.getElementById("btnCreate").addEventListener("click", function(e){
    e.preventDefault();
    var name = (document.getElementById("cfgName").value || "").trim() || "VlN_game_germany";
    var gb = parseInt(document.getElementById("cfgGB").value, 10) || 50;
    
    var confText = buildConf(name, gb);
    CONFIGS.unshift({ name: name, gb: gb, confText: confText });
    save();
    
    downloadText(confText, name + ".conf");
    toast("✅ کانفیگ ساخته و دانلود شد");
    switchTab("configs");
  });

  document.body.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    var idx = parseInt(btn.getAttribute("data-idx"), 10);
    var cfg = CONFIGS[idx];
    if (!cfg) return;

    if (act === "dl") {
      downloadText(cfg.confText, cfg.name + ".conf");
      toast("⬇️ فایل دانلود شد");
    } else if (act === "copy") {
      copyText(cfg.confText);
    } else if (act === "del") {
      if (confirm("حذف شود؟")) {
        CONFIGS.splice(idx, 1);
        save();
        renderList();
        renderDash();
        toast("🗑️ حذف شد");
      }
    }
  });

  load();
  renderList();
  renderDash();
})();
</script>
</body>
</html>
